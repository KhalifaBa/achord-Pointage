# Build Android (APK) avec EAS à chaque push sur main.
# À la fin : QR code + lien de l'APK dans le résumé du workflow (onglet Actions).
# Prérequis : secret EXPO_TOKEN dans Settings → Secrets and variables → Actions.
name: EAS Build Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']   # pas de build pour un simple changement de doc
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

concurrency:
  group: eas-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier le jeton Expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Le secret EXPO_TOKEN manque (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Build APK (attend la fin du build sur Expo)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build --platform android --profile preview \
            --non-interactive --wait --json > build.json
          cat build.json
          echo "id=$(jq -r '.[0].id' build.json)" >> "$GITHUB_OUTPUT"
          echo "apk=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"

      - name: QR code de l'APK
        env:
          APK: ${{ steps.build.outputs.apk }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          OWNER=$(jq -r '.expo.owner' app.json)
          SLUG=$(jq -r '.expo.slug' app.json)
          PAGE="https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$BUILD_ID"
          QR_DATA=$(jq -rn --arg u "$APK" '$u|@uri')
          {
            echo "## 📱 APK prêt"
            echo ""
            echo "Scanne avec ton téléphone pour installer :"
            echo ""
            echo "![QR code](https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=$QR_DATA)"
            echo ""
            echo "- [⬇️ Télécharger l'APK]($APK)"
            echo "- [Page du build sur Expo]($PAGE)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Le même QR code, directement dans les logs
          npx --yes qrcode@1.5.4 --small "$APK" || true
